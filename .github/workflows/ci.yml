name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          bash -n scripts/sync.sh

      - name: Host half registers its tools
        run: node scripts/smoke.mjs

      - name: Bundle manifest is complete
        run: |
          node -e "
          const p = require('./package.json');
          const assert = require('node:assert');
          assert.equal(p.type, 'module');
          assert.ok(p.dsh?.bundle?.patch, 'dsh.bundle.patch is required');
          assert.ok(p.dsh?.client?.platform, 'dsh.client.platform is required');
          assert.ok(p.exports['./package.json'], 'exports must expose ./package.json or the client scanner cannot read dsh.client');
          assert.ok(p.exports['./client'], 'exports must expose ./client');
          for (const f of ['index.js', 'client.js', 'cordis.patch.yml', 'icon.svg']) {
            require('node:fs').accessSync(f);
          }
          console.log('manifest ok');
          "
